schema_version = 1

[project]
root = "."
include_tests = false
build_tags = []

[[rules]]
id = "ARCH001"
kind = "layer_dependencies"
description = "检查工具自身的分层依赖"
severity = "error"
unmatched = "error"
allow_same_layer = true
allow_stdlib = true
external_default = "deny"

[[rules.layers]]
name = "cli"
packages = ["cmd/..."]
allow = ["config", "checker"]
allow_external = []

[[rules.layers]]
name = "checker"
packages = ["internal/checker/..."]
allow = ["config"]
allow_external = ["golang.org/x/tools/go/packages"]

[[rules.layers]]
name = "config"
packages = ["internal/config/..."]
allow = []
allow_external = ["github.com/BurntSushi/toml"]

[[rules]]
id = "FMT001"
kind = "source_format"
description = "生产源码行宽不超过 120，文件名与包名使用小写"
severity = "error"

[rules.format]
packages = ["..."]
max_line_length = 120
tab_width = 4
file_name_pattern = '[a-z][a-z0-9_]*\.go'
package_name_pattern = '[a-z][a-z0-9]*'

[[rules]]
id = "LAYOUT001"
kind = "file_layout"
description = "保留使用说明、规则示例及命令入口"
severity = "error"

[rules.layout]
required_files = ["README.md", "rules.toml", "cmd/go-static-checker/main.go"]
required_directories = ["internal/config", "internal/checker"]
