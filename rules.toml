# go-static-checker 仓库自检配置。
# CI 使用：./bin/go-static-checker -config rules.toml
schema_version = 1

[project]
# 相对于本配置文件，必须包含 go.mod。
root = "."
# 当前版本仅支持生产源码；生成代码照常检查。
include_tests = false
# 按当前 GOOS、GOARCH 和 CGO_ENABLED 选择文件，不额外启用构建标签。
build_tags = []

# 分层依赖：cli → checker → config；cli 也可以直接读取 config。
# allow 仅授权直接导入，不传递授权。
[[rules]]
id = "ARCH001"
kind = "layer_dependencies"
description = "检查工具自身的分层依赖"
severity = "error"
# 新增本模块包必须归层；匹配多个层会报配置错误。
unmatched = "error"
allow_same_layer = true
allow_stdlib = true
# 第三方依赖必须在所属层的 allow_external 中显式放行。
external_default = "deny"

[[rules.layers]]
name = "cli"
packages = ["cmd/..."]
allow = ["config", "checker"]
allow_external = []

[[rules.layers]]
name = "checker"
packages = ["internal/checker/..."]
allow = ["config"]
allow_external = ["golang.org/x/tools/go/packages"]

[[rules.layers]]
name = "config"
packages = ["internal/config/..."]
allow = []
allow_external = ["github.com/BurntSushi/toml"]

# 源码格式：只检查当前构建环境选中的生产文件。
[[rules]]
id = "FMT001"
kind = "source_format"
description = "生产源码行宽不超过 120，文件名与包名使用小写"
severity = "error"

[rules.format]
packages = ["..."]
# Unicode 码点计宽，中文计为 1；换行符不计入行宽。
max_line_length = 120
# Tab 前进到下一个 4 的倍数位置。
tab_width = 4
# 正则匹配整个名称；文件名包含 .go 扩展名。
# TOML 单引号字符串中的反斜杠不需要额外转义。
file_name_pattern = '[a-z][a-z0-9_]*\.go'
package_name_pattern = '[a-z][a-z0-9]*'

# 项目结构：精确路径相对于 project.root，不禁止其他文件或目录。
[[rules]]
id = "LAYOUT001"
kind = "file_layout"
description = "保留模块定义、使用说明、规则示例、CI 配置及命令入口"
severity = "error"

[rules.layout]
required_files = [
  "go.mod",
  "go.sum",
  "README.md",
  "rules.toml",
  ".github/workflows/ci.yml",
  "cmd/go-static-checker/main.go",
]
required_directories = ["internal/config", "internal/checker"]

# 函数、方法和结构体声明之间至少保留一行空行，包含测试源码。
[[rules]]
id = "FMT002"
kind = "source_format"
description = "相邻函数、方法和结构体声明之间至少保留一行空行"
severity = "error"

[rules.format]
packages = ["..."]
max_line_length = 0
tab_width = 4
file_name_pattern = ""
package_name_pattern = ""
min_blank_lines_between_declarations = 1
include_tests = true

# 以下为待实现的规则草案。当前检查器会拒绝新字段，CI 失败符合预期。
# COMMENT001 和 COMMENT004 使用已指定的 20% 与第 80 列限制；其他规则仍为初始提案。
# 本 PR 不修改检查器。
# 注释归属：doc 为紧邻声明的说明，body 为声明内部独立注释，
# trailing 为代码同行注释。字段注释计入所属结构体或接口，
# 局部类型与匿名函数中的注释计入外层声明；同一块内不重复计数。
# package 汇总所选构建环境中同一导入路径的文件，包含文件头及声明说明。
# 各块独立检查：子块的代码与注释也计入外层块和 package 的预算。
# Go 指令不计入注释预算，也不能代替说明注释；列宽规则仍检查指令行。

[[rules]]
id = "COMMENT001"
kind = "comment_budget"
description = "每个结构块的注释预算为注释与代码总行数的 20%，向上取整且至少允许 1 行"
severity = "error"

[rules.comments]
packages = ["..."]
declarations = ["function", "method", "struct", "package"]
visibility = "all"
include_tests = false
include_generated = false
exclude_go_directives = true
# 按注释占用的物理行计数，块注释内部空行计入；同一物理行不重复计数。
count_unit = "physical_lines"
# 有效代码行：去掉注释后仍有代码；排除空白行及仅含下列分隔符的行。
# 混合代码与注释的行分别计入代码行与注释行。字符串内容不按注释识别。
denominator = "comment_and_code_lines"
exclude_delimiter_only_lines = ["{", "}", "(", ")", ";"]
# 基础占比：comment_lines / (comment_lines + effective_code_lines) <= 0.2。
# 总量为上述两类行数之和，不包括空白行和被排除的分隔符行。
# 实际预算：max(1, ceil((comment_lines + effective_code_lines) * 20 / 100))。
# 注释行数不超过此预算即通过；向上取整与最低额度允许实际占比略超 20%。
# 例如 3 行代码 + 1 行注释通过；3 行代码 + 2 行注释不通过。
# 至少允许 1 行是预算下限，不要求每个块实际写注释；总量为 0 时无需计算比值。
max_comment_percent = 20
rounding = "ceil"
min_allowed_comment_lines = 1

[[rules]]
id = "COMMENT002"
kind = "required_comments"
description = "导出的函数、方法、结构体和接口必须有声明说明"
severity = "error"

[rules.comments]
packages = ["..."]
declarations = ["function", "method", "struct", "interface"]
visibility = "exported"
include_tests = false
include_generated = false
exclude_go_directives = true
# 说明必须紧邻声明且含有非空文本；body 和 trailing 不能替代 doc。
position = "doc"
require_nonempty = true

[[rules]]
id = "COMMENT003"
kind = "comment_format"
description = "声明说明以名称开头，内部注释使用双斜杠，禁止行尾注释"
severity = "error"

[rules.comments]
packages = ["..."]
declarations = ["function", "method", "struct", "interface"]
visibility = "all"
include_tests = false
include_generated = false
exclude_go_directives = true
# 正则整串匹配去掉注释标记及一个可选空格后的单行文本。
# 文档说明仅检查首行；结构体字段说明归入 body，不使用外层类型名称。
[rules.comments.doc]
style = "line"
require_name_prefix = true
# 名称之后必须有空白分隔及非空说明，避免只重复声明名称。
require_text_after_name = true

[rules.comments.body]
style = "line"
line_pattern = '\S.*'

[rules.comments.trailing]
allowed = false


# 第 80 列为包含式上限，约束完整物理行，不只是去掉 // 后的正文。
[[rules]]
id = "COMMENT004"
kind = "comment_line_length"
description = "包含注释的源码行不得超过第 80 列"
severity = "error"

[rules.comments]
packages = ["..."]
include_tests = false
include_generated = false
exclude_go_directives = false
# 覆盖声明说明、块内注释、行尾注释和文件头；块注释的每行均检查。
positions = ["doc", "body", "trailing", "file"]
max_column = 80
# 从第 1 列计数，包含缩进、注释标记及同一行的代码；LF/CRLF 不计宽。
# Unicode 码点各占 1 列，Tab 前进至下一个 4 的倍数制表位。
column_metric = "unicode_codepoints"
tab_width = 4

[[rules]]
id = "DOC001"
kind = "file_policy"
description = "Markdown 仅允许项目根目录的 README.md"
severity = "error"

[rules.files]
# 相对于 project.root 扫描，不受 Go 构建标签影响。
extensions = [".md"]
extension_case_sensitive = false
default = "deny"
# 路径大小写精确匹配，仅允许根级 README.md；子目录 README.md 也不允许。
allowed_paths = ["README.md"]
allowed_directories = []
# 仅排除 Git 元数据，docs、vendor 和其他隐藏目录也受位置限制。
excluded_directories = [".git"]
# 不遍历目录符号链接；指向 Markdown 的文件符号链接按链接所在位置检查。
follow_directory_symlinks = false
