# go-static-checker 仓库自检配置。
# CI 使用：./bin/go-static-checker -config rules.toml
schema_version = 1
includes = [
  "rules/layer_dependencies.toml",
  "rules/source_format.toml",
  "rules/file_layout.toml",
  "rules/comment_budget.toml",
  "rules/required_comments.toml",
  "rules/comment_format.toml",
  "rules/comment_line_length.toml",
  "rules/file_policy.toml",
  "rules/call_contract.toml",
]

[project]
# 相对于本配置文件，必须包含 go.mod。
root = "."
# 当前版本仅支持生产源码；生成代码照常检查。
include_tests = false
# 按当前 GOOS、GOARCH 和 CGO_ENABLED 选择文件，不额外启用构建标签。
build_tags = []
